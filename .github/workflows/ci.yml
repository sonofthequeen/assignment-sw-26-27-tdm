name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/constraints.txt
      - name: Install (pinned by constraints.txt)
        run: python -m pip install -c constraints.txt -e ".[dev]"
      - name: Dependency consistency
        run: python -m pip check
      - name: Migrations from an empty database and drift check
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/ci.sqlite3
        run: |
          alembic upgrade head
          alembic current
          alembic check
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        run: python -m pytest -q -p no:cacheprovider

  frontend:
    name: Frontend (Node 24)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose file
        run: docker compose config --quiet
      - name: Build images
        run: docker compose build
      - name: Start the stack with demo data and smoke-test it
        env:
          SEED_DEMO_DATA: "true"
        run: |
          docker compose up -d --wait
          docker compose exec -T backend python --version
          docker compose exec -T backend alembic current
          curl -fsS http://localhost:8080/runs > /dev/null
          curl -fsS "http://localhost:8080/api/v1/runs?limit=1"
      - name: Stop the stack
        if: always()
        run: docker compose down -v
