server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # API and its documentation go to the backend service (Compose DNS name), so the
    # browser stays on one origin and the backend needs no CORS configuration.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /docs { proxy_pass http://backend:8000; }
    location = /openapi.json { proxy_pass http://backend:8000; }

    # Vite emits content-hashed file names: safe to cache for a long time.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA: unknown paths serve index.html so client-side routes survive a refresh.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
